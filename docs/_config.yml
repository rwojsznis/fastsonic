title: Fastsonic
description: A fast, native client for self-hosted Subsonic music servers.
lang: en-US
timezone: Europe/Berlin
url: https://rwojsznis.github.io
baseurl: "/fastsonic"
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Subsonic client
        - self-hosted music
        - Navidrome
        - Rust
        - egui
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Fastsonic showing a playlist with the queue open and a track playing
    publisher:
      type: Person
      name: Rafal Wojsznis
      url: https://github.com/rwojsznis
      same_as:
        - https://github.com/rwojsznis/fastsonic
  llms:
    title: Fastsonic
    description: >-
      Documentation for Fastsonic, a native client for self-hosted Subsonic
      music servers on Linux, macOS, and Windows.
    full: true
    details: >-
      Covers installation, server sign-in, local playback, settings, files,
      and network connections. Source is on
      [GitHub](https://github.com/rwojsznis/fastsonic).
  branding:
    site_title: Fastsonic
    logo:
      default: /assets/images/logo.svg
      alt: Fastsonic
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    copyright: >-
      <span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Fastsonic is an independent open-source project.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/rwojsznis/fastsonic/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: rwojsznis/fastsonic
    text: Star
    show_count: true
  github_sponsor:
    enabled: false

plugins:
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
