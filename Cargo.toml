[package]
name = "fastsonic"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A native client for self-hosted music servers"
repository = "https://github.com/rwojsznis/fastsonic"
keywords = ["subsonic", "music", "egui", "self-hosted", "player"]
categories = ["multimedia::audio"]

[lib]
name = "fastsonic"
path = "src/lib.rs"

[[bin]]
name = "fastsonic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# Reading what a system font covers, so the app can borrow a face for a script
# Inter cannot draw. skrifa is the parser epaint already rasterizes with, and
# the version has to track epaint's or the binary compiles two copies of it;
# memmap2 keeps the probe to the few pages of each font that answer the
# question.
skrifa = "0.44"
memmap2 = "0.9"
# bmp is for Winamp skins, whose bitmaps are BMP files.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# Inflating the zip a Winamp skin comes as (src/skin/zip.rs). Already
# compiled for reqwest's gzip support, so this adds no code to the build.
flate2 = "1"
# Filling glyph outlines with no anti-aliasing for the Winamp playlist's
# text (src/ui/winamp/pixel_text.rs). Already compiled for the SVG icons
# through egui_extras and resvg, so this adds no code to the build.
tiny-skia = "0.11"
# MilkDrop, as libprojectM reimplements it, for the MilkDrop window
# (src/milkdrop.rs). Built into the binary, so it stays one file.
projectm-sys = { version = "1.2.2", default-features = false, features = ["static"], optional = true }
# The MilkDrop window runs as a child process with its own winit event loop
# and OpenGL context (src/milkdrop/child.rs), because winit allows one event
# loop per process and eframe owns the app's. These are the same versions
# eframe already pulls in, so they add no build. Only compiled with the
# milkdrop feature.
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Decoding what the music server streams. D12 asks for the file as it is on
# disk, so the library's formats are this client's to decode: FLAC beside
# 320k MP3 beside AAC in MP4.
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "vorbis", "ogg", "isomp4", "aac", "alac", "wav", "aiff", "pcm", "adpcm", "all-meta", "opt-simd"] }
# The one codec symphonia does not carry, in any version, and an ordinary
# thing to find in a self-hosted library. Pure Rust with no dependencies of
# its own, so it adds no C build the way libopus would (Q7 in
# migration/00-decisions.md, where the four options are measured); its decode
# of the fixture library is byte-equal to libopus's. `src/opus.rs` wraps it
# as a symphonia decoder, and is the only file that knows which
# implementation this is.
opus-pure = "0.2"
# Local playback uses rodio and cpal directly. Device opening is fallible
# because a release build aborts on panic.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
# 0.13 dropped the `rustls-tls-native-roots` feature. Its replacement,
# `rustls`, means aws-lc-rs, whose C build would put cmake (and NASM on
# Windows) in front of every packager. `rustls-no-provider` leaves the choice
# here instead: ring, installed once at startup by `install_tls_provider`.
# Roots now come from
# rustls-platform-verifier, which asks the operating system rather than
# reading its trust store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "gzip", "http2", "blocking"] }
# Named directly only to pick the crypto provider reqwest no longer picks.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# `fs` is used by the playlist cache in `backend.rs`. On Linux the
# mpris-server dependency happens to turn it on, which is why leaving it out
# built there and nowhere else.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
# Subsonic authenticates with `t=md5(password + salt)`. MD5 is the
# protocol's choice, not a security claim of ours: it is a wire format here,
# and the pair it produces is stored instead of the password (D10).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
open = "5"
percent-encoding = "2"
urlencoding = "2"
jiff = "0.2"
unicode-bidi = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# The tray item and the desktop's media controls on Windows and macOS, so
# closing the window keeps the music playing there too. Linux has ksni and
# mpris-server below.
tray-icon = { version = "0.24", default-features = false }
souvlaki = { version = "0.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Serving AppKit while no window exists: the status item and Dock reopen
# callback live on the main thread.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }

# AccessKit connects egui's control names, states, and actions to native
# screen readers.
#
# Not on macOS. `accesskit_macos` puts a view of its own in the window, and
# tearing that window down mid-session leaves AppKit's Touch Bar observation
# registered for `nextResponder` against a view that has gone; the next
# display flush throws NSRangeException and the process aborts. The Winamp
# switch does exactly that teardown, because it returns from `run_native` and
# starts a fresh event loop, so Cmd+Shift+M killed the app every time.
#
# Upstream 0.7.0 ships the same pair and crashes identically, so this is not
# a porting mistake to fix here. `accesskit_macos` 0.27 may well fix it, but
# eframe 0.36 pins the 0.26 line, so this waits on an eframe bump.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }

[target.'cfg(windows)'.dependencies]
# A hidden window for the media controls to belong to, and message loops.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
mpris-server = { version = "0.10", features = ["tokio"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["milkdrop"]
# Sample data and screenshot flags; never part of a release build.
demo = []
# MilkDrop, through libprojectM: a C++ library that CMake builds into the
# binary at compile time, so building needs cmake, a C++ compiler, and
# libclang. `--no-default-features` leaves it out.
milkdrop = ["dep:projectm-sys", "dep:winit", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# macOS's default `unpacked` leaves a .o per codegen unit that Cargo never deletes; `debug = 2` if a debugger needs more than line numbers.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
debug = false

# projectm-sys names the library it links after Rust's profile (a `d` suffix
# for dev) but CMake names what it builds after the optimisation level, so an
# optimised dev build would look for a library that was never made. A debug
# build of libprojectM is fine to develop against; releases are optimised.
[profile.dev.package.projectm-sys]
opt-level = 0

# projectm-sys 1.2.2 hardcodes the Visual Studio 17 2022 CMake generator,
# which GitHub's windows-latest images no longer carry; the fork lets an
# explicit CMAKE_GENERATOR win. Drop when upstream takes the change.
[patch.crates-io]
projectm-sys = { git = "https://github.com/crmne/projectm-rs", branch = "respect-cmake-generator" }
