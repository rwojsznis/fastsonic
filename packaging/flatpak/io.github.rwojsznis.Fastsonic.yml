# Fastsonic as a Flatpak, built from source: the manifest Flathub builds
# from. The copy in the Flathub repository names a tag and its commit in
# the source below and carries cargo-sources.json next to it; flathub.sh
# writes both. For a local build, this one takes the checkout as it is:
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.rwojsznis.Fastsonic.yml
#
# The release workflow does not build from source twice: it packages the
# binary the Linux job already built, through the bundle manifest beside
# this one, whose finish-args are the same as these.
id: io.github.rwojsznis.Fastsonic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fastsonic
finish-args:
  # Wayland first, X11 when that is what there is.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound: PulseAudio, which PipeWire also answers.
  - --socket=pulseaudio
  # The server API, audio streams, artwork, lyrics, and update checks all
  # mDNS for receivers on the network.
  - --share=network
  # The tray item, media keys and Now Playing over MPRIS, and the name the
  # single instance is found by.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.fastsonic
  - --own-name=io.github.rwojsznis.Fastsonic.Instance
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/fastsonic/cargo
modules:
  - name: fastsonic
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/fastsonic /app/bin/fastsonic
      - install -Dm644 packaging/applications/fastsonic.desktop /app/share/applications/io.github.rwojsznis.Fastsonic.desktop
      - sed -i 's/^Icon=fastsonic$/Icon=io.github.rwojsznis.Fastsonic/' /app/share/applications/io.github.rwojsznis.Fastsonic.desktop
      - install -Dm644 packaging/icons/fastsonic.svg /app/share/icons/hicolor/scalable/apps/io.github.rwojsznis.Fastsonic.svg
      - install -Dm644 packaging/flatpak/io.github.rwojsznis.Fastsonic.metainfo.xml /app/share/metainfo/io.github.rwojsznis.Fastsonic.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/fastsonic/LICENSE
    sources:
      - type: dir
        path: ../..
      # Every crate the lockfile names, for the offline build; flathub.sh
      # writes it with flatpak-cargo-generator.
      - cargo-sources.json
