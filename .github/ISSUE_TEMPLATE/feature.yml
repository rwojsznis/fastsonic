name: Feature request
description: Something Fastpotify should do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      placeholder: "Show the lyrics of the playing song, synced when Spotify has them."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: What you do today instead, and how often it comes up.
    validations:
      required: true
