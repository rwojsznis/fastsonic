name: Feature request
description: Something Fastpotify should do.
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before requesting
      options:
        - label: I searched open and closed issues for this request.
          required: true
        - label: I read the project boundaries in CONTRIBUTING.md.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should Fastpotify solve?
      description: Describe the workflow and pain, not only the name of a feature.
      placeholder: "When I ..., I cannot ..., so I currently have to ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would a good solution look like?
      description: Include alternatives you considered and how often this comes up.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why does this fit Fastpotify?
      description: Explain how it preserves a small, native, cross-platform Spotify client.
    validations:
      required: true
