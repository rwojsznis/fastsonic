name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          # Chrome is preconfigured on GitHub's x64 runner but is unrelated
          # to the build. Ignore either apt source format so a repository
          # mid-sync cannot break Fastsonic's dependency installation.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # Only main writes the cache. A pull request reads it and builds on
      # top; letting every branch save its own copy filled the repository's
      # ten-gigabyte cache in a few days, and a full cache evicts the entry
      # the next build wanted.
      - uses: Swatinem/rust-cache@v2
        with:
          # v2: caches from before the projectm-sys fork replay its stale
          # build output instead of compiling the fork.
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    # The arm64 runner has four cores and needs longer from cold.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm is the only place the Windows on ARM build is tested.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-windows-static
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. The
      # generator is job-level env, since a GITHUB_ENV write never reached
      # the build script. Native tools on each runner: the action's default
      # is x64, which on the arm64 runner would compile under emulation.
      - name: MSVC environment for libprojectM
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The demo feature carries the headless render test that lays out every
      # page, panel, and dialog without a display.
      - name: Tests (default features)
        run: cargo test --locked --all-targets
      - name: Tests (all features)
        run: cargo test --locked --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executable CI actually produced.
      - name: Standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          $imports = & dumpbin /dependents target\debug\fastsonic.exe | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Fastsonic imports an MSVC runtime:`n$runtime" }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          $headers = & dumpbin /headers target\debug\fastsonic.exe | Out-String
          if ($headers -notmatch $machine) { throw "fastsonic.exe is not built for $env:RUNNER_ARCH`:`n$headers" }

      # The installer is otherwise compiled only when a release is tagged,
      # and each architecture takes its own branch of the script.
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          & $iscc "/DVersion=$version" "/DArch=$arch" "/DBinary=$PWD\target\debug\fastsonic.exe" "/DOutputDir=$env:RUNNER_TEMP\fastsonic-installer-check" packaging\windows\fastsonic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs and uninstalls throwaway copies under their own identity,
      # with a stand-in executable running from inside and outside them.
      - name: Windows uninstaller
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          python packaging\windows\test-uninstall.py $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
